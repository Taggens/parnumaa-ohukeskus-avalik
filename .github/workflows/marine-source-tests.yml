name: Marine research source tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_marine_sources.py'
      - '.github/workflows/marine-source-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marine-source-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile script
        run: python -m py_compile scripts/probe_marine_sources.py
      - name: Check KAIA and TalTech read-only access
        run: python scripts/probe_marine_sources.py
      - name: Save result as research report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/marine_sources_access_20261124.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Salvesta Mereseire andmeallikate kontroll"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
