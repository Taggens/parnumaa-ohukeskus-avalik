name: Avaliku andmeedastuse kontroll
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['docs/data/*.json', '.github/workflows/check-public-delivery.yml', 'scripts/check_public_delivery.py']
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: public-delivery-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: python3 scripts/check_public_delivery.py
