name: Parnu river monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/river-monitor.yml'
      - 'scripts/update_rivers.py'
      - 'docs/data/state.json'
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parnu-river-monitor
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the next hourly observation is due
        id: river
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          import os

          due = True
          if os.environ["EVENT"] == "push" and os.environ["HEAD_MESSAGE"] == "Ohukeskuse avalike andmete uuendus":
              try:
                  with open("docs/data/rivers.json", encoding="utf-8") as file:
                      observations = json.load(file)["observations"]
                  stamp = dt.datetime.fromisoformat(observations["feed_timestamp_utc"])
                  now = dt.datetime.now(dt.timezone.utc)
                  observation_slot = (now - dt.timedelta(minutes=10)).replace(minute=10, second=0, microsecond=0)
                  due = observations["source_status"] != "ok" or not observation_slot <= stamp <= now
              except (OSError, ValueError, KeyError, TypeError):
                  due = True
          print("due=" + str(due).lower())
          PY
      - uses: actions/setup-python@v5
        if: steps.river.outputs.due == 'true'
        with:
          python-version: '3.12'
      - name: Run river monitor validation tests
        if: steps.river.outputs.due == 'true'
        run: python scripts/update_rivers.py --selftest
      - name: Refresh latest XML and historical water levels
        if: steps.river.outputs.due == 'true'
        run: python scripts/update_rivers.py --output docs/data/rivers.json
      - name: Commit safe public data only
        if: steps.river.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/rivers.json
          if git diff --cached --quiet; then
            echo "No change in river data"
            exit 0
          fi
          git commit -m "Uuenda Pärnumaa jõeseire avalikke andmeid"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Push failed after retries" >&2
          exit 1
